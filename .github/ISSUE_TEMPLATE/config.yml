# Issue template chooser configuration.

# Require one of the templates above rather than allowing a blank issue, so every
# issue carries the fields the lifecycle depends on.
blank_issues_enabled: false

# No `contact_links:`. The template shipped two, and both would have pointed at
# a page that does not exist here:
#
#   - Discussions is not enabled on this repository.
#   - A direct link to the "report a vulnerability" form is redundant — GitHub
#     already surfaces private vulnerability reporting from the Security tab,
#     and a link in the issue chooser is not what stops someone filing a
#     vulnerability as a public issue.
#
# SECURITY.md carries the reporting route and is the single place it is stated,
# so it cannot drift out of sync with a copy here. Add a contact link back only
# when it points somewhere real.
