# Issue template chooser configuration.
# CUSTOMIZE the contact links, or delete any that do not apply.

# Require one of the templates above rather than allowing a blank issue, so every
# issue carries the fields the lifecycle depends on.
blank_issues_enabled: false

contact_links:
  - name: Report a security vulnerability
    url: https://github.com/ORG/REPO/security/advisories/new
    about: >-
      Never report a vulnerability in a public issue. Use private advisory
      reporting — see SECURITY.md.

  - name: Ask a question
    url: https://github.com/ORG/REPO/discussions
    about: >-
      For questions and design discussion that are not yet a bug or a feature
      request. (Requires Discussions to be enabled.)
