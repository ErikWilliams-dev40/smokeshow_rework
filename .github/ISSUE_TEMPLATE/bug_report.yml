name: Bug report
description: Something behaves incorrectly.
title: "fix: <short summary>"
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        **Do not report security vulnerabilities here.** Close this form and use
        the private reporting route described in `SECURITY.md`.

  - type: textarea
    id: summary
    attributes:
      label: What happens
      description: The incorrect behaviour, in a sentence or two.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What should happen instead
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Where did you see this
      options:
        - Production
        - Staging
        - Local development
        - Not sure
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit SHA
      description: >-
        The deployed commit SHA if you know it. This pins the report to an exact
        version of the code.
    validations:
      required: false

  - type: textarea
    id: evidence
    attributes:
      label: Logs, errors, or screenshots
      description: Redact any secret, token, or personal data before pasting.
    validations:
      required: false

  - type: dropdown
    id: impact
    attributes:
      label: Impact
      options:
        - Blocking — production is broken or data is at risk
        - Major — core functionality unusable, no workaround
        - Minor — works with a workaround
        - Cosmetic
    validations:
      required: true
