name: Staging deploy (reusable)

# Builds the reviewed commit in staging mode and deploys it to the Worker
# `smokeshow-web-staging` with the `cf` CLI. The account, Worker name and D1
# binding come from cloudflare.config.ts; nothing here names them. See
# docs/decisions/0001-cloudflare-workers-adapter.md and Helix issue #11.
#
# Reusable workflow: it is called by another workflow, never triggered directly.
# Called by: .github/workflows/deploy.yml

on:
  workflow_call:
    inputs:
      commit-sha:
        description: >-
          Full 40-character SHA to deploy. This is the identity of the release;
          it is validated below and must not be a branch or tag name.
        type: string
        required: true
      environment:
        description: Name of the GitHub Environment holding staging credentials.
        type: string
        default: staging
      runner:
        description: Runner label to execute on.
        type: string
        default: ubuntu-latest
    outputs:
      url:
        description: Base URL the deployment is reachable at, for the health check.
        value: ${{ jobs.deploy.outputs.url }}
    secrets:
      CLOUDFLARE_API_TOKEN:
        description: Cloudflare API token for the Worker. Stored on the Environment.
        # Fails the run if the caller omits it. It cannot tell whether the value
        # is empty; the "Check deploy configuration" step below does that.
        required: true

# ── Where the deploy credential comes from ───────────────────────────────────
# Store it as a secret on the GitHub Environment named by the `environment`
# input (Settings → Environments → staging → Add secret).
#
# The caller must still pass it by name. A reusable workflow receives only the
# secrets its caller passes, environment secrets included, and an unpassed one
# resolves to an empty string with no error. The job below binds the
# environment, and the Environment secret overrides whatever the caller passed,
# so the caller job needs no environment. That holds only while the Environment
# has its own secret of this name, so never create a repo- or org-level
# CLOUDFLARE_API_TOKEN: it would silently stand in for a missing staging one.
#
# Use the SAME secret name on the staging and production Environments with
# different values. That is what keeps a staging run unable to read production
# credentials: the environment binding, not the secret's name.
# ─────────────────────────────────────────────────────────────────────────────

# Least privilege: deny everything here, grant the minimum per job.
permissions: {}

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    # Binds the job to the GitHub Environment, which is where staging secrets and
    # any protection rules live.
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.deploy.outputs.url }}
    env:
      # Corepack otherwise prompts before downloading the pinned pnpm, which
      # would hang a non-interactive runner.
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      DB_ID_STAGING: ${{ vars.DB_ID_STAGING }}
      DB_ID_PRODUCTION: ${{ vars.DB_ID_PRODUCTION }}
      PRODUCTION_ZONE_ID: ${{ vars.PRODUCTION_ZONE_ID }}
      DEPLOY_URL: ${{ vars.DEPLOY_URL }}
      BLOG_API_URL: ${{ vars.BLOG_API_URL }}
      LEADS_ENABLED: ${{ vars.LEADS_ENABLED || 'false' }}
      MAIL_FROM: ${{ vars.MAIL_FROM }}
      SALES_INBOX: ${{ vars.SALES_INBOX }}
      LEAD_TEST_RECIPIENTS: ${{ vars.LEAD_TEST_RECIPIENTS }}
    permissions:
      contents: read # required only so actions/checkout can read the repository
      # No id-token: Cloudflare does not accept GitHub OIDC for Workers deploys,
      # so the credential is a scoped API token held as an Environment secret.
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Validate commit SHA
        env:
          COMMIT_SHA: ${{ inputs.commit-sha }}
        run: |
          if ! printf '%s' "$COMMIT_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error title=Invalid commit SHA::Expected a full 40-character lowercase hex SHA, got '$COMMIT_SHA'."
            echo "A branch or tag name would let the deployed code drift from the reviewed code."
            exit 1
          fi
          echo "Deploying commit $COMMIT_SHA"

      - name: Check out the exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        # Pinned to a full commit SHA, not the mutable @v7 tag. Published by
        # GitHub; see docs/RECOMMENDED_ACTIONS.md.
        with:
          ref: ${{ inputs.commit-sha }}
          persist-credentials: false
          # Full history, so origin/main is present for the ancestry check below.
          fetch-depth: 0

      - name: Refuse commits not on main
        # The SHA check above proves the format, not that anyone reviewed it.
        # checkout fetches any SHA in the repository network, unmerged branches
        # included, and the deploy step runs that commit's config and
        # dependencies with the Cloudflare token in its environment. Only
        # merged code gets that far.
        env:
          COMMIT_SHA: ${{ inputs.commit-sha }}
        run: |
          if ! git merge-base --is-ancestor "$COMMIT_SHA" origin/main; then
            echo "::error title=Unmerged commit::$COMMIT_SHA is not on main. Only merged commits are deployed."
            exit 1
          fi
          echo "$COMMIT_SHA is on main"

      # ── Toolchain ─────────────────────────────────────────────────────────
      # Same as build.yml: setup-node reads .nvmrc, and corepack resolves the
      # pnpm pinned by `packageManager`. See the notes there.
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # actions/setup-node v7.0.0
        # Pinned to a full commit SHA, not the mutable @v7 tag. Published by
        # GitHub; see docs/RECOMMENDED_ACTIONS.md.
        with:
          node-version-file: .nvmrc

      - name: Verify Node matches .nvmrc
        run: |
          actual="$(node -p 'process.versions.node.split(".")[0]')"
          expected="$(tr -d '[:space:]' < .nvmrc)"
          if [ "$actual" != "$expected" ]; then
            echo "::error title=Node version mismatch::Node ${actual} is active; .nvmrc pins ${expected}. setup-node did not install the pinned version."
            exit 1
          fi
          echo "node $(node --version), pnpm $(corepack pnpm --version)"

      - name: Check deploy configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/check-deploy-config.mjs staging

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Build (staging mode)
        # COMMIT_SHA is compiled into /api/health, which is how the health check
        # can tell this release from the version it replaced.
        env:
          COMMIT_SHA: ${{ inputs.commit-sha }}
        run: corepack pnpm exec vite build --mode staging

      - name: Apply additive D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: corepack pnpm db:migrate:staging

      - name: Deploy
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          COMMIT_SHA: ${{ inputs.commit-sha }}
          DEPLOY_URL: ${{ vars.DEPLOY_URL }}
          RUN_ID: ${{ github.run_id }}
          CF_QUIET: "1"
        # --provision=false: resources are created by an admin, never as a side
        # effect of a deploy. The message carries the full SHA so rollback can
        # find this version again.
        run: |
          set -euo pipefail
          corepack pnpm exec cf deploy --mode staging --prebuilt --provision=false \
            --tag "${COMMIT_SHA:0:12}" \
            --message "sha=$COMMIT_SHA run=$RUN_ID"
          echo "url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
