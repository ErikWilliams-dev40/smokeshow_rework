name: Production deploy (reusable)

# Builds the exact approved commit in production mode and deploys it to the Worker
# `smokeshow-web` with the `cf` CLI. The account, Worker name and D1
# binding come from cloudflare.config.ts; nothing here names them. See
# docs/decisions/0001-cloudflare-workers-adapter.md and Helix issue #11.
#
# Reusable workflow: it is called by another workflow, never triggered directly.
# Called by: .github/workflows/deploy.yml

on:
  workflow_call:
    inputs:
      commit-sha:
        description: >-
          Full 40-character SHA to deploy. This is the identity of the release;
          it is validated below and must not be a branch or tag name.
        type: string
        required: true
      approved-sha:
        description: Full SHA from the approved release record; must match commit-sha.
        type: string
        required: true
      environment:
        description: Name of the GitHub Environment holding production credentials.
        type: string
        default: production
      runner:
        description: Runner label to execute on.
        type: string
        default: ubuntu-latest
    outputs:
      url:
        description: Base URL the deployment is reachable at, for the health check.
        value: ${{ jobs.deploy.outputs.url }}
    secrets:
      BLOG_API_TOKEN:
        description: Read credential shared with the deployed blog API.
        required: true
      CLOUDFLARE_API_TOKEN:
        description: Cloudflare API token for the Worker. Stored on the Environment.
        # Fails the run if the caller omits it. It cannot tell whether the value
        # is empty; the "Check deploy configuration" step below does that.
        required: true

# The production Environment must hold its own scoped API token and required
# reviewers. The caller forwards only that named secret; never secrets: inherit.
# Do not create a repository-wide token that could replace an absent secret.

# Least privilege: deny everything here, grant the minimum per job.
permissions: {}

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    # Binds the job to the GitHub Environment, which is where production secrets and
    # any protection rules live.
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.deploy.outputs.url }}
    env:
      # Corepack otherwise prompts before downloading the pinned pnpm, which
      # would hang a non-interactive runner.
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      DEBUG: ""
      CF_SEND_TELEMETRY: "false"
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      DB_ID_PRODUCTION: ${{ vars.DB_ID_PRODUCTION }}
      PRODUCTION_ZONE_ID: ${{ vars.PRODUCTION_ZONE_ID }}
      DEPLOY_URL: ${{ vars.DEPLOY_URL }}
      BLOG_API_URL: ${{ vars.BLOG_API_URL }}
      LEADS_ENABLED: ${{ vars.LEADS_ENABLED || 'false' }}
      MAIL_FROM: ${{ vars.MAIL_FROM }}
      SALES_INBOX: ${{ vars.SALES_INBOX }}
    permissions:
      contents: read # required only so actions/checkout can read the repository
      # No id-token: Cloudflare does not accept GitHub OIDC for Workers deploys,
      # so the credential is a scoped API token held as an Environment secret.
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Verify the deploy target matches the approved commit
        env:
          COMMIT_SHA: ${{ inputs.commit-sha }}
          APPROVED_SHA: ${{ inputs.approved-sha }}
        run: |
          set -euo pipefail

          for pair in "COMMIT_SHA:$COMMIT_SHA" "APPROVED_SHA:$APPROVED_SHA"; do
            name="${pair%%:*}"
            value="${pair#*:}"
            if ! printf '%s' "$value" | grep -Eq '^[0-9a-f]{40}$'; then
              echo "::error title=Invalid $name::Expected a full 40-character lowercase hex SHA, got '$value'."
              echo "A branch or tag name can move, so it cannot identify an approved release."
              exit 1
            fi
          done

          if [ "$COMMIT_SHA" != "$APPROVED_SHA" ]; then
            echo "::error title=Approval mismatch::Refusing to deploy."
            echo "  approved: $APPROVED_SHA"
            echo "  requested: $COMMIT_SHA"
            echo "The approval on record does not cover the requested commit."
            echo "Re-run the review gates against $COMMIT_SHA and record a new release."
            exit 1
          fi

          echo "Approved commit confirmed: $COMMIT_SHA"

      - name: Check out the exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        # Pinned to a full commit SHA, not the mutable @v7 tag. Published by
        # GitHub; see docs/RECOMMENDED_ACTIONS.md.
        with:
          ref: ${{ inputs.commit-sha }}
          persist-credentials: false
          # Full history, so origin/main is present for the ancestry check below.
          fetch-depth: 0

      - name: Refuse commits not on main
        # The SHA check above proves the format, not that anyone reviewed it.
        # checkout fetches any SHA in the repository network, unmerged branches
        # included, and the deploy step runs that commit's config and
        # dependencies with the Cloudflare token in its environment. Only
        # merged code gets that far.
        env:
          COMMIT_SHA: ${{ inputs.commit-sha }}
        run: |
          if ! git merge-base --is-ancestor "$COMMIT_SHA" origin/main; then
            echo "::error title=Unmerged commit::$COMMIT_SHA is not on main. Only merged commits are deployed."
            exit 1
          fi
          echo "$COMMIT_SHA is on main"

      # ── Toolchain ─────────────────────────────────────────────────────────
      # Same as build.yml: setup-node reads .nvmrc, and corepack resolves the
      # pnpm pinned by `packageManager`. See the notes there.
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # actions/setup-node v7.0.0
        # Pinned to a full commit SHA, not the mutable @v7 tag. Published by
        # GitHub; see docs/RECOMMENDED_ACTIONS.md.
        with:
          node-version-file: .nvmrc

      - name: Verify Node matches .nvmrc
        run: |
          actual="$(node -p 'process.versions.node.split(".")[0]')"
          expected="$(tr -d '[:space:]' < .nvmrc)"
          if [ "$actual" != "$expected" ]; then
            echo "::error title=Node version mismatch::Node ${actual} is active; .nvmrc pins ${expected}. setup-node did not install the pinned version."
            exit 1
          fi
          echo "node $(node --version), pnpm $(corepack pnpm --version)"

      - name: Check deploy configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/check-deploy-config.mjs production

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Build (production mode)
        # COMMIT_SHA is compiled into /api/health, which is how the health check
        # can tell this release from the version it replaced.
        env:
          COMMIT_SHA: ${{ inputs.commit-sha }}
        run: corepack pnpm exec vite build --mode production

      - name: Apply additive D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: corepack pnpm db:migrate:prod

      - name: Deploy
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          COMMIT_SHA: ${{ inputs.commit-sha }}
          DEPLOY_URL: ${{ vars.DEPLOY_URL }}
          RUN_ID: ${{ github.run_id }}
          BLOG_API_TOKEN: ${{ secrets.BLOG_API_TOKEN }}
          BLOG_WEBSITE_SECRETS_FILE: ${{ runner.temp }}/blog-website-secrets.json
          CF_QUIET: "1"
        # --provision=false: resources are created by an admin, never as a side
        # effect of a deploy. The message carries the full SHA so rollback can
        # find this version again.
        run: |
          set -euo pipefail
          trap 'rm -f "$BLOG_WEBSITE_SECRETS_FILE"' EXIT
          node --input-type=module -e '
            import {writeFileSync} from "node:fs";
            const token = process.env.BLOG_API_TOKEN;
            if (!/^[\x21-\x7e]{32,512}$/.test(token ?? "")) throw new Error("Invalid blog read credential");
            writeFileSync(process.env.BLOG_WEBSITE_SECRETS_FILE, JSON.stringify({BLOG_API_TOKEN:token}), {mode:0o600,flag:"wx"});
          '

          corepack pnpm exec cf deploy --mode production --prebuilt --provision=false \
            --secrets-file "$BLOG_WEBSITE_SECRETS_FILE" \
            --tag "${COMMIT_SHA:0:12}" \
            --message "sha=$COMMIT_SHA run=$RUN_ID"
          echo "url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"

      - name: Verify the website reaches the exact healthy blog API
        env:
          COMMIT_SHA: ${{ inputs.commit-sha }}
        run: node scripts/check-website-blog.mjs
