name: PR checks

# Caller workflow. Runs the four automated gates on every pull request.
# The reusable workflows it calls are placeholders — see README.md for why they
# fail until customized.
#
# Configure these four as required status checks in branch protection
# (Settings → Branches) so a PR cannot merge without them.

on:
  pull_request:
    branches: [main] # CUSTOMIZE if the default branch has another name
  # Also runs on pushes to the default branch so the branch's own state is
  # checked after merge, not only in the PR.
  push:
    branches: [main] # CUSTOMIZE if the default branch has another name

# Least privilege at the top level. A reusable workflow can narrow this token but
# never widen it, so anything a called job needs must be granted here.
permissions:
  contents: read

# A new push to a PR supersedes that PR's in-flight checks. Runs on the default
# branch are never cancelled — each commit on it keeps its own pass/fail record,
# which is what you consult when deciding whether a SHA is releasable.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# A job that calls a reusable workflow produces a check named
# "<this job> / <job inside the called workflow>", so these are EXPECTED to appear
# as "lint / Lint", "test / Test", "build / Build", "security-check / Security check".
#
# Do NOT configure those as required status checks from this comment — it is a
# prediction, not an observation. A required check whose name matches nothing is
# silently never enforced. Run this workflow in the real repository first, read the
# actual names off the run, then configure branch protection.
# See docs/LIFECYCLE.md → "Required status checks — deferred".
#
# No `name:` is set on these jobs on purpose — it would only add a third redundant
# word to the check name.
jobs:
  lint:
    uses: ./.github/workflows/lint.yml
    permissions:
      contents: read

  test:
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  build:
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read

  security-check:
    uses: ./.github/workflows/security-check.yml
    permissions:
      contents: read
      # security-events: write  # only if security-check.yml uploads SARIF

  # The AI/security review gate and the peer-approval gate are not jobs here.
  # AI review runs against the diff using .claude/agents/security-reviewer.md,
  # and peer approval will be enforced by .github/CODEOWNERS plus branch protection
  # once those are configured — neither is operational yet.
  # See docs/LIFECYCLE.md.
