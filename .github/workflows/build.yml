name: Build (reusable)

# PLACEHOLDER. This workflow does not know how this project is built, or whether
# it needs building at all. Replace the step marked CUSTOMIZE with a real build
# command — or delete this workflow and its call site if the project has no
# build step (see docs/CUSTOMIZATION.md).
#
# Reusable workflow: it is called by another workflow, never triggered directly.
# Called by: .github/workflows/pr-checks.yml

on:
  workflow_call:
    inputs:
      runner:
        description: Runner label to execute on.
        type: string
        default: ubuntu-latest
      working-directory:
        description: Directory to run the build command in.
        type: string
        default: "."
      ref:
        description: Git ref or SHA to check out. Defaults to the caller's ref.
        type: string
        default: ""

# Least privilege: deny everything here, grant the minimum per job.
permissions: {}

jobs:
  build:
    name: Build
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    permissions:
      contents: read # required only so actions/checkout can read the repository
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        # Pinned to a full commit SHA, not the mutable @v7 tag. Published by
        # GitHub; see docs/RECOMMENDED_ACTIONS.md.
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      # ── CUSTOMIZE ─────────────────────────────────────────────────────────
      # Replace this entire step with the build command for this project.
      # Per-stack guidance: docs/CUSTOMIZATION.md
      #
      # Build-time configuration: pass non-secret values as inputs, and secrets
      # via `workflow_call.secrets`. Do not read production secrets in a build
      # that also runs on pull requests from forks.
      #
      # If the deploy workflows should consume this build's output rather than
      # rebuilding, add an artifact upload here (actions/upload-artifact) and a
      # matching download in the deploy workflow. That is left unwired until you
      # know what the build produces — see docs/RECOMMENDED_ACTIONS.md.
      - name: Build
        run: |
          echo "::error title=Template not configured::.github/workflows/build.yml is still a placeholder."
          echo "Replace the 'Build' step with this project's build command,"
          echo "or delete this workflow if the project has no build step."
          echo "See docs/CUSTOMIZATION.md for the section matching your stack."
          exit 1
      # ──────────────────────────────────────────────────────────────────────
