name: Build (reusable)

# Builds the Next.js application. This gate is kept rather than deleted because
# the project has a real build, and because the build is where a server-only
# module leaking into a client component surfaces as an error rather than as a
# runtime price the browser can edit.
#
# Reusable workflow: it is called by another workflow, never triggered directly.
# Called by: .github/workflows/pr-checks.yml

on:
  workflow_call:
    inputs:
      runner:
        description: Runner label to execute on.
        type: string
        default: ubuntu-latest
      working-directory:
        description: Directory to run the build command in.
        type: string
        default: "."
      ref:
        description: Git ref or SHA to check out. Defaults to the caller's ref.
        type: string
        default: ""

# Least privilege: deny everything here, grant the minimum per job.
permissions: {}

jobs:
  build:
    name: Build
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    env:
      # Corepack otherwise prompts for confirmation before it downloads
      # the pinned pnpm, which would hang a non-interactive runner.
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    permissions:
      contents: read # required only so actions/checkout can read the repository
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        # Pinned to a full commit SHA, not the mutable @v7 tag. Published by
        # GitHub; see docs/RECOMMENDED_ACTIONS.md.
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      # ── Toolchain ─────────────────────────────────────────────────────────
      # `setup-node` is the second and last action in this repository, pinned to
      # a full commit SHA like the first.
      #
      # docs/RECOMMENDED_ACTIONS.md prefers the runner's preinstalled runtime
      # and a plain command, and that held until the version needed pinning.
      # Relying on the image meant the effective Node major was whatever GitHub
      # happened to install — not a pin at all. It broke CI twice (3772969,
      # cc61f5b), and both times the fix was to move `.nvmrc` to match the
      # runner rather than the other way round. The action inverts that: it
      # makes `.nvmrc` authoritative rather than aspirational. See issue #13.
      #
      # It reads `.nvmrc` rather than carrying a version of its own, so the Node
      # version still has exactly one definition in this repository.
      #
      # Corepack is bundled with Node and resolves pnpm to the exact version
      # pinned by `packageManager` in package.json, so the package manager is
      # pinned by the manifest rather than by anything in here.
      #
      # `corepack pnpm ...` is used rather than `corepack enable`, because
      # enabling writes a shim into the Node installation directory and that
      # needs privileges the runner does not reliably have.
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # actions/setup-node v7.0.0
        # Pinned to a full commit SHA, not the mutable @v7 tag. Published by
        # GitHub; see docs/RECOMMENDED_ACTIONS.md.
        with:
          node-version-file: .nvmrc

      - name: Verify Node matches .nvmrc
        # Kept after the move to setup-node, with a different job. It no longer
        # guards against the runner image drifting — it now confirms the action
        # installed what was asked for. A silent fallback to the preinstalled
        # Node would otherwise look exactly like success.
        run: |
          actual="$(node -p 'process.versions.node.split(".")[0]')"
          expected="$(tr -d '[:space:]' < .nvmrc)"
          if [ "$actual" != "$expected" ]; then
            echo "::error title=Node version mismatch::Node ${actual} is active; .nvmrc pins ${expected}. setup-node did not install the pinned version."
            exit 1
          fi
          echo "node $(node --version), pnpm $(corepack pnpm --version)"

      - name: Install dependencies
        # --frozen-lockfile is the CI-oriented install: it fails rather than
        # silently updating pnpm-lock.yaml, so CI cannot resolve a different
        # dependency tree than the one that was reviewed.
        run: corepack pnpm install --frozen-lockfile

      - name: Build
        run: corepack pnpm run build
