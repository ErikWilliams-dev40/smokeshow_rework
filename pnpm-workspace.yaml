# pnpm settings. As of pnpm 12 these live here rather than in package.json.
#
# Dependency install scripts are a supply-chain surface: a postinstall runs
# arbitrary code with the developer's and the CI runner's privileges. Nothing in
# this project is allowed to run one.
# `unrs-resolver` (a transitive dependency of the Next.js ESLint config) ships a
# postinstall that fetches or builds its native resolver binary. It is not
# needed here: the prebuilt @unrs/resolver-binding-linux-x64-gnu package is
# already installed as an optional dependency and ESLint resolves fine without
# the script. Declining it explicitly, rather than approving it, keeps
# `pnpm install --frozen-lockfile` reproducible in CI with no build step.
allowBuilds:
  unrs-resolver: false

# Keep vulnerable transitive versions out until their parents raise the minimums.
overrides:
  brace-expansion@<1.1.21: 1.1.21
  brace-expansion@>=4.0.0 <5.0.12: 5.0.12
  fast-uri@>=3.0.0 <3.1.8: 3.1.8
  sharp@<0.35.5: 0.35.5
  source-map-js@>=1.0.0 <1.2.2: 1.2.2

# No patched braces release exists. It is used only by ESLint/Stylelint to
# expand repository-controlled glob patterns, never request or upload input.
# Accept only this advisory; remove the exception when an upstream fix ships.
auditConfig:
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm
